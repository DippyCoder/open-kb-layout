name: Feature request
description: Suggest an idea for the editor or the site.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today or other approaches you considered.
